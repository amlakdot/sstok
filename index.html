<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مانیتورینگ آنی محصولات و تخفیف‌ها</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 30px; }
        .container { max-width: 800px; margin: auto; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: #38bdf8; margin-bottom: 5px; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; font-family: 'Vazirmatn', sans-serif; margin-top: 15px; }
        button:hover { background: #0ea5e9; }
        button:disabled { background: #64748b; cursor: not-allowed; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border-right: 4px solid #38bdf8; }
        .card a { color: #38bdf8; text-decoration: none; display: inline-block; margin-top: 10px; font-size: 14px; }
        .card a:hover { text-decoration: underline; }
        .price { color: #4ade80; font-weight: bold; }
        .fake-discount { color: #f87171; font-size: 14px; background: rgba(248, 113, 113, 0.1); padding: 5px 10px; border-radius: 6px; margin-top: 8px; display: inline-block; }
        .hidden { display: none; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); width: 36px; height: 36px; border-radius: 50%; border-left-color: #38bdf8; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 مانیتورینگ هوشمند بازار</h1>
            <p>روی دکمه زیر بزنید تا در لحظه محصولات پرفروش و وضعیت تخفیف‌ها استعلام شوند:</p>
            <button id="fetch-btn" onclick="fetchLiveData()">استعلام آنی از دیجی‌کالا ⚡</button>
        </header>

        <main id="loading" class="hidden">
            <div class="spinner"></div>
            <p style="text-align: center;">در حال اتصال به سرور و استخراج داده‌های زنده...</p>
        </main>

        <section id="results-container">
            <!-- کارت محصولات اینجا لود میشه -->
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
